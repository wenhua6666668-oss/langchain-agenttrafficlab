[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-agenttrafficlab"
version = "0.3.0"
description = "LangChain middleware and two-stage dynamic MCP execution for Agent Traffic Lab"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agent Traffic Lab" }]
keywords = [
  "langchain",
  "langgraph",
  "mcp",
  "middleware",
  "provider-routing",
  "ai-agent",
  "agent-tools",
  "tool-discovery",
  "provider-discovery",
  "failover",
  "agent-traffic-lab",
  "atl",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "langchain>=1.0,<2",
  "langchain-mcp-adapters>=0.3,<0.4",
  "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://agenttrafficlab.com"
Documentation = "https://agenttrafficlab.com"
Repository = "https://github.com/wenhua6666668-oss/langchain-agenttrafficlab"
Issues = "https://github.com/wenhua6666668-oss/langchain-agenttrafficlab/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_agenttrafficlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
